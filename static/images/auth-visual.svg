<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1080" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <radialGradient id="orb1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 260) rotate(45) scale(420)">
      <stop stop-color="#6366F1" stop-opacity="0.55" />
      <stop offset="1" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(720 780) rotate(45) scale(460)">
      <stop stop-color="#06B6D4" stop-opacity="0.4" />
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb3" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(680 200) rotate(45) scale(340)">
      <stop stop-color="#A855F7" stop-opacity="0.42" />
      <stop offset="1" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="900" height="1080" fill="url(#bg)" />
  <rect width="900" height="1080" fill="url(#grid)" />
  <rect width="900" height="1080" fill="url(#orb1)" />
  <rect width="900" height="1080" fill="url(#orb2)" />
  <rect width="900" height="1080" fill="url(#orb3)" />

  <!-- Connecting innovation network lines -->
  <g stroke="#818CF8" stroke-opacity="0.28" stroke-width="1.5">
    <line x1="180" y1="360" x2="450" y2="290" />
    <line x1="450" y1="290" x2="720" y2="390" />
    <line x1="450" y1="290" x2="540" y2="560" />
    <line x1="180" y1="360" x2="310" y2="610" />
    <line x1="310" y1="610" x2="540" y2="560" />
    <line x1="540" y1="560" x2="720" y2="390" />
  </g>

  <!-- Network nodes -->
  <circle cx="180" cy="360" r="8" fill="#38BDF8" />
  <circle cx="450" cy="290" r="10" fill="#A78BFA" />
  <circle cx="720" cy="390" r="8" fill="#818CF8" />
  <circle cx="310" cy="610" r="7" fill="#34D399" />
  <circle cx="540" cy="560" r="9" fill="#22D3EE" />

  <!-- Floating Glass Card 1: Project Proof-of-Work -->
  <g transform="translate(120 310)">
    <rect width="420" height="190" rx="22" fill="#FFFFFF" fill-opacity="0.08" stroke="url(#cardStroke)" stroke-width="1.5" />
    <rect x="28" y="28" width="132" height="28" rx="14" fill="#4F46E5" fill-opacity="0.35" stroke="#818CF8" stroke-opacity="0.5" />
    <text x="44" y="47" fill="#E0E7FF" font-family="system-ui, sans-serif" font-size="13" font-weight="600">PROOF OF WORK</text>
    <text x="28" y="92" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Autonomous Agri-Drone</text>
    <text x="28" y="120" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="14">ROS2 · Edge Vision · 4 Verified Contributors</text>
    <rect x="28" y="146" width="364" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.14" />
    <rect x="28" y="146" width="290" height="10" rx="5" fill="url(#barGrad)" />
  </g>

  <!-- Floating Glass Card 2: Verified Badge -->
  <g transform="translate(380 520)">
    <rect width="390" height="168" rx="22" fill="#FFFFFF" fill-opacity="0.09" stroke="url(#cardStroke)" stroke-width="1.5" />
    <circle cx="54" cy="58" r="24" fill="#10B981" fill-opacity="0.22" stroke="#34D399" stroke-opacity="0.6" />
    <path d="M45 58 L51 64 L64 51" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="94" y="54" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Verified STEM Portfolio</text>
    <text x="94" y="78" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">25 Broad Domains · 86 Disciplines</text>
    <rect x="28" y="108" width="102" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.1" />
    <text x="48" y="128" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AI &amp; Robotics</text>
    <rect x="142" y="108" width="110" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.1" />
    <text x="162" y="128" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Clean Energy</text>
    <rect x="264" y="108" width="96" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.1" />
    <text x="286" y="128" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">BioTech</text>
  </g>
</svg>
